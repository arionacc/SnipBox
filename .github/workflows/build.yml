name: Build SnipBox APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Pasang JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK sudah terpasang di runner ubuntu-latest, jadi cukup
      # menerima lisensi dan memastikan platform 34 tersedia.
      - name: Siapkan Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -n 1)"; fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Pasang Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Mencari folder proyek (yang berisi app/src/main/AndroidManifest.xml),
      # lalu membuat file Gradle yang hilang. Aman dijalankan walau repo
      # sudah punya file Gradle sendiri: file yang sudah ada tidak ditimpa.
      - name: Siapkan struktur proyek
        run: |
          MANIFEST="$(find . -path '*/app/src/main/AndroidManifest.xml' -not -path '*/build/*' | head -n 1)"
          if [ -z "$MANIFEST" ]; then
            echo "::error::app/src/main/AndroidManifest.xml tidak ditemukan. Pastikan folder app/ ada di repo."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$(dirname "$(dirname "$(dirname "$MANIFEST")")")")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Folder proyek: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SnipBox"
          include(":app")
          EOF
          fi

          if [ ! -f build.gradle ] && [ ! -f build.gradle.kts ]; then
            cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          fi

          if [ ! -f gradle.properties ]; then
            cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF
          fi

          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.arionacc.snipbox"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.arionacc.snipbox"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF
          fi

          echo "Isi folder proyek:"
          ls -la

      - name: Build APK debug
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnipBox-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
