name: Build SnipBox APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Pasang JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK sudah terpasang di runner ubuntu-latest, jadi cukup
      # menerima lisensi dan memastikan platform 34 tersedia.
      - name: Siapkan Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -n 1)"; fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Pasang Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK debug
        run: gradle assembleDebug --stacktrace

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnipBox-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
